PACKAGE_NAME="hid-steam-backport"
PACKAGE_VERSION="7.3-rc1"

BUILT_MODULE_NAME[0]="hid-steam"
DEST_MODULE_LOCATION[0]="/updates"

# The bounds are what make this retire itself. They are inclusive, so MAX 7.3
# permits 7.2.999 and stops at 7.3-rc1, which is where the driver went in-tree:
# past that dkms skips the module rather than shadowing a newer copy of itself
# with this one. The floor is linux/unaligned.h, which the driver includes and
# which arrived in 6.12.
BUILD_EXCLUSIVE_KERNEL_MIN="6.12"
BUILD_EXCLUSIVE_KERNEL_MAX="7.3"

AUTOINSTALL="yes"
